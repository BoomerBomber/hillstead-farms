<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hillstead Farms badge">
  <title>Hillstead Farms — Primary Badge</title>
  <defs>
    <path id="arcTop" d="M 88,300 A 212,212 0 0 1 512,300" fill="none"/>
    <path id="arcBot" d="M 92,300 A 208,208 0 0 0 508,300" fill="none"/>
    <clipPath id="sceneClip"><circle cx="300" cy="300" r="180"/></clipPath>
  </defs>

  <!-- ============ RINGS ============ -->
  <circle cx="300" cy="300" r="296" fill="#F6F1E4"/>
  <circle cx="300" cy="300" r="288" fill="none" stroke="#1E3B2C" stroke-width="7"/>
  <circle cx="300" cy="300" r="276" fill="none" stroke="#1E3B2C" stroke-width="1.8"/>
  <circle cx="300" cy="300" r="252" fill="none" stroke="#C9A227" stroke-width="1.6"/>

  <!-- side diamonds between the arcs -->
  <g fill="#C9A227">
    <path d="M 222,300 l 0,0" opacity="0"/>
    <path d="M 71,300 l 7,-7 l 7,7 l -7,7 Z"/>
    <path d="M 515,300 l 7,-7 l 7,7 l -7,7 Z"/>
  </g>

  <!-- ============ INNER SCENE ============ -->
  <circle cx="300" cy="300" r="184" fill="none" stroke="#C9A227" stroke-width="2"/>
  <circle cx="300" cy="300" r="180" fill="#F6F1E4"/>

  <g clip-path="url(#sceneClip)">
    <!-- sun + rays -->
    <circle cx="300" cy="262" r="50" fill="#C9A227"/>
    <circle cx="300" cy="262" r="57" fill="none" stroke="#C9A227" stroke-width="1.6" opacity=".55"/>
    <g stroke="#C9A227" stroke-width="2.6" stroke-linecap="round">
      <path d="M 300,182 L 300,164"/>
      <path d="M 260,193 L 251,177"/>
      <path d="M 340,193 L 349,177"/>
      <path d="M 230,224 L 215,211"/>
      <path d="M 370,224 L 385,211"/>
      <path d="M 214,262 L 196,259"/>
      <path d="M 386,262 L 404,259"/>
    </g>

    <!-- back hills -->
    <path d="M 96,318 C 150,282 216,300 300,290 C 384,300 450,282 504,318 L 504,500 L 96,500 Z" fill="#2F5233"/>
    <g stroke="#F6F1E4" stroke-width="1.3" opacity=".18" fill="none">
      <path d="M 130,310 C 176,291 232,298 288,293"/>
      <path d="M 142,320 C 188,303 242,308 290,302"/>
      <path d="M 312,293 C 368,298 424,291 470,310"/>
      <path d="M 310,302 C 362,308 412,303 458,320"/>
    </g>

    <!-- front field -->
    <path d="M 96,392 C 170,352 250,368 320,362 C 390,356 450,360 504,388 L 504,510 L 96,510 Z" fill="#1E3B2C"/>
    <g stroke="#F6F1E4" stroke-width="1.6" opacity=".26" fill="none">
      <path d="M 136,398 C 200,374 300,378 372,374 C 420,372 458,378 484,390"/>
      <path d="M 148,414 C 210,392 302,396 380,392 C 424,390 456,396 478,406"/>
      <path d="M 162,432 C 222,412 308,416 388,412 C 428,410 452,416 472,424"/>
      <path d="M 180,450 C 236,432 314,436 392,432 C 426,430 446,436 462,442"/>
    </g>

    <!-- fence: left + right of barn -->
    <g stroke="#1E3B2C" stroke-width="3" stroke-linecap="round">
      <path d="M 152,354 L 152,382"/><path d="M 182,347 L 182,375"/><path d="M 212,344 L 212,370"/>
      <path d="M 388,344 L 388,370"/><path d="M 418,347 L 418,375"/><path d="M 448,354 L 448,382"/>
    </g>
    <g stroke="#1E3B2C" stroke-width="2.2">
      <path d="M 146,362 L 218,352"/><path d="M 146,373 L 218,363"/>
      <path d="M 382,352 L 454,362"/><path d="M 382,363 L 454,373"/>
    </g>

    <!-- barn: gambrel front, deep green with cream trim -->
    <g>
      <path d="M 240,316 L 240,398 L 360,398 L 360,316 L 348,316 L 348,300 L 252,300 L 252,316 Z" fill="#1E3B2C"/>
      <path d="M 232,318 L 252,296 L 272,282 L 300,276 L 328,282 L 348,296 L 368,318"
            fill="none" stroke="#1E3B2C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 240,316 L 258,296 L 278,284 L 300,279 L 322,284 L 342,296 L 360,316 Z" fill="#1E3B2C"/>
      <path d="M 244,314 L 261,295 L 281,284 L 300,280 L 319,284 L 339,295 L 356,314"
            fill="none" stroke="#C9A227" stroke-width="2" opacity=".9"/>
      <!-- cupola -->
      <g>
        <rect x="290" y="252" width="20" height="22" fill="#1E3B2C"/>
        <path d="M 286,254 L 300,242 L 314,254 Z" fill="#1E3B2C"/>
        <rect x="295" y="258" width="10" height="10" fill="#C9A227"/>
        <path d="M 300,242 L 300,233" stroke="#1E3B2C" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="300" cy="231" r="2.6" fill="#C9A227"/>
      </g>
      <!-- siding lines -->
      <g stroke="#F6F1E4" stroke-width="1.2" opacity=".22">
        <path d="M 250,322 L 250,396"/><path d="M 262,322 L 262,396"/><path d="M 274,322 L 274,396"/>
        <path d="M 326,322 L 326,396"/><path d="M 338,322 L 338,396"/><path d="M 350,322 L 350,396"/>
      </g>
      <!-- hayloft door -->
      <rect x="284" y="292" width="32" height="24" rx="2" fill="#F6F1E4"/>
      <path d="M 284,292 L 316,316 M 316,292 L 284,316" stroke="#1E3B2C" stroke-width="2.4"/>
      <rect x="284" y="292" width="32" height="24" rx="2" fill="none" stroke="#1E3B2C" stroke-width="2.6"/>
      <!-- main doors with cross-bucks -->
      <rect x="272" y="340" width="56" height="58" fill="#F6F1E4"/>
      <path d="M 300,340 L 300,398" stroke="#1E3B2C" stroke-width="2.6"/>
      <path d="M 272,340 L 300,368 M 300,340 L 272,368 M 300,368 L 328,340 M 300,340 L 328,368" stroke="#1E3B2C" stroke-width="2.2"/>
      <path d="M 272,368 L 300,398 M 300,368 L 272,398 M 300,368 L 328,398 M 328,368 L 300,398" stroke="#1E3B2C" stroke-width="2.2"/>
      <rect x="272" y="340" width="56" height="58" fill="none" stroke="#1E3B2C" stroke-width="3"/>
      <!-- windows -->
      <g>
        <rect x="250" y="344" width="15" height="18" fill="#F6F1E4" stroke="#1E3B2C" stroke-width="2.2"/>
        <path d="M 257.5,344 L 257.5,362 M 250,353 L 265,353" stroke="#1E3B2C" stroke-width="1.4"/>
        <rect x="335" y="344" width="15" height="18" fill="#F6F1E4" stroke="#1E3B2C" stroke-width="2.2"/>
        <path d="M 342.5,344 L 342.5,362 M 335,353 L 350,353" stroke="#1E3B2C" stroke-width="1.4"/>
      </g>
    </g>

    <!-- EST · 2020 split on the field -->
    <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-weight="600"
       font-size="24" letter-spacing="3" fill="#F6F1E4" text-anchor="middle">
      <text x="196" y="390">EST.</text>
      <text x="405" y="390">2020</text>
    </g>
  </g>

  <!-- ============ WHEAT LAURELS flanking the scene ============ -->
  <g stroke="#C9A227" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 128,458 C 106,418 96,368 102,318"/>
    <path d="M 472,458 C 494,418 504,368 498,318"/>
  </g>
  <g fill="#C9A227">
    <ellipse cx="107" cy="330" rx="6" ry="12" transform="rotate(-14 107 330)"/>
    <ellipse cx="97"  cy="352" rx="6" ry="12" transform="rotate(-24 97 352)"/>
    <ellipse cx="111" cy="354" rx="6" ry="12" transform="rotate(6 111 354)"/>
    <ellipse cx="96"  cy="378" rx="6" ry="12" transform="rotate(-28 96 378)"/>
    <ellipse cx="112" cy="380" rx="6" ry="12" transform="rotate(4 112 380)"/>
    <ellipse cx="102" cy="404" rx="6" ry="12" transform="rotate(-30 102 404)"/>
    <ellipse cx="117" cy="406" rx="6" ry="12" transform="rotate(2 117 406)"/>
    <ellipse cx="112" cy="430" rx="6" ry="12" transform="rotate(-26 112 430)"/>
    <ellipse cx="126" cy="432" rx="6" ry="12" transform="rotate(8 126 432)"/>

    <ellipse cx="493" cy="330" rx="6" ry="12" transform="rotate(14 493 330)"/>
    <ellipse cx="503" cy="352" rx="6" ry="12" transform="rotate(24 503 352)"/>
    <ellipse cx="489" cy="354" rx="6" ry="12" transform="rotate(-6 489 354)"/>
    <ellipse cx="504" cy="378" rx="6" ry="12" transform="rotate(28 504 378)"/>
    <ellipse cx="488" cy="380" rx="6" ry="12" transform="rotate(-4 488 380)"/>
    <ellipse cx="498" cy="404" rx="6" ry="12" transform="rotate(30 498 404)"/>
    <ellipse cx="483" cy="406" rx="6" ry="12" transform="rotate(-2 483 406)"/>
    <ellipse cx="488" cy="430" rx="6" ry="12" transform="rotate(26 488 430)"/>
    <ellipse cx="474" cy="432" rx="6" ry="12" transform="rotate(-8 474 432)"/>
  </g>

  <!-- ============ ARC TEXT ============ -->
  <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="46" font-weight="700"
        fill="#1E3B2C" letter-spacing="7">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">HILLSTEAD FARMS</textPath>
  </text>
  <text font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="22" font-weight="600"
        fill="#1E3B2C" letter-spacing="5">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">COTTONTOWN &#183; TENNESSEE</textPath>
  </text>
</svg>
