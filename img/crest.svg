<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hillstead Farms crest">
  <title>Hillstead Farms — Classic Crest</title>
  <defs>
    <path id="topArc" d="M 55,158 A 155,155 0 0 1 345,158" fill="none"/>
    <path id="bottomArc" d="M 55,246 A 155,155 0 0 0 345,246" fill="none"/>
  </defs>

  <circle cx="200" cy="200" r="196" fill="#F6F1E4"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#1E3B2C" stroke-width="4"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- sun -->
  <circle cx="200" cy="182" r="34" fill="#C9A227"/>

  <!-- hills -->
  <path d="M 72,236 C 110,196 150,214 200,196 C 250,214 290,196 328,236 L 328,300 L 72,300 Z" fill="#1E3B2C"/>
  <path d="M 72,258 C 120,224 160,246 200,224 C 240,246 280,224 328,258 L 328,300 L 72,300 Z" fill="#2F5233"/>

  <!-- barn silhouette on hill -->
  <g fill="#F6F1E4">
    <path d="M 178,196 L 200,178 L 222,196 L 222,214 L 178,214 Z"/>
    <rect x="196" y="200" width="8" height="14"/>
  </g>

  <!-- wheat sprigs -->
  <g stroke="#C9A227" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 92,300 C 96,270 90,240 100,214"/>
    <g fill="#C9A227" stroke="none">
      <ellipse cx="93" cy="222" rx="5" ry="9" transform="rotate(-20 93 222)"/>
      <ellipse cx="88" cy="238" rx="5" ry="9" transform="rotate(-25 88 238)"/>
      <ellipse cx="98" cy="238" rx="5" ry="9" transform="rotate(15 98 238)"/>
      <ellipse cx="84" cy="256" rx="5" ry="9" transform="rotate(-30 84 256)"/>
      <ellipse cx="96" cy="256" rx="5" ry="9" transform="rotate(10 96 256)"/>
      <ellipse cx="80" cy="276" rx="5" ry="9" transform="rotate(-32 80 276)"/>
      <ellipse cx="94" cy="278" rx="5" ry="9" transform="rotate(8 94 278)"/>
    </g>
    <path d="M 308,300 C 304,270 310,240 300,214"/>
    <g fill="#C9A227" stroke="none">
      <ellipse cx="307" cy="222" rx="5" ry="9" transform="rotate(20 307 222)"/>
      <ellipse cx="312" cy="238" rx="5" ry="9" transform="rotate(25 312 238)"/>
      <ellipse cx="302" cy="238" rx="5" ry="9" transform="rotate(-15 302 238)"/>
      <ellipse cx="316" cy="256" rx="5" ry="9" transform="rotate(30 316 256)"/>
      <ellipse cx="304" cy="256" rx="5" ry="9" transform="rotate(-10 304 256)"/>
      <ellipse cx="320" cy="276" rx="5" ry="9" transform="rotate(32 320 276)"/>
      <ellipse cx="306" cy="278" rx="5" ry="9" transform="rotate(-8 306 278)"/>
    </g>
  </g>

  <!-- arced text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#1E3B2C" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">HILLSTEAD FARMS</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1E3B2C" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">FAMILY · LAND · TABLE</textPath>
  </text>
</svg>
